<!doctype html><meta charset="utf-8"><title>page-loop demo</title>
<style>body{margin:0;background:#101418;color:#d8e0e8;font:16px system-ui} #stage{display:block;margin:20px}</style>
<canvas id="stage" width="320" height="200"></canvas>
<script>
const c = document.getElementById('stage'), g = c.getContext('2d');
window.draw = (a, label) => {
  g.fillStyle = '#101418'; g.fillRect(0, 0, 320, 200);
  g.save(); g.translate(160, 100); g.rotate(a); g.fillStyle = '#6fb3d2'; g.fillRect(-50, -50, 100, 100);
  g.fillStyle = '#e0a458'; g.fillRect(30, -50, 20, 20); g.restore();
  g.fillStyle = '#d8e0e8'; g.fillText(label, 12, 190);
};
draw(0, 'start');
</script>
